<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 12 — AbhishekMart E-Commerce | Abhishek Kumar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="brand">AbhishekMart</div>
    <div class="nav-tabs">
      <button class="tab-btn active" data-tab="shop">Shop</button>
      <button class="tab-btn" data-tab="cart">Cart (<span id="cart-count">0</span>)</button>
      <button class="tab-btn" data-tab="orders">Successful Orders (<span id="orders-count">0</span>)</button>
      <button class="tab-btn" data-tab="seller">Seller Master Panel</button>
    </div>
  </nav>

  <main class="container">
    <!-- SHOP -->
    <section id="tab-shop" class="tab-panel active">
      <h1>All Products</h1>
      <div id="shop-grid" class="grid"></div>
    </section>

    <!-- CART & PAYMENT -->
    <section id="tab-cart" class="tab-panel">
      <h1>Shopping Cart &amp; Payment</h1>
      <div class="split">
        <div class="panel-box">
          <h2>Cart Items</h2>
          <div id="cart-list"></div>
          <h3 id="cart-total" style="margin-top:14px;">Total: ₹0</h3>
        </div>
        <div class="panel-box">
          <h2>Payment Checkout</h2>
          <form id="checkout-form">
            <label>Full Name</label>
            <input type="text" id="cust-name" value="Abhishek Kumar" required />
            <label>Payment Method</label>
            <select id="pay-method">
              <option value="UPI">UPI (GPay / PhonePe)</option>
              <option value="Credit/Debit Card">Credit / Debit Card</option>
              <option value="Net Banking">Net Banking</option>
            </select>
            <label>Card Last 4 Digits / UPI Ref</label>
            <input type="text" id="pay-ref" placeholder="e.g., 4242 or abhishek@upi" required />
            <button type="submit" class="btn-primary">Pay &amp; Place Order</button>
          </form>
        </div>
      </div>
    </section>

    <!-- ORDERS -->
    <section id="tab-orders" class="tab-panel">
      <h1>Successful Orders</h1>
      <div id="orders-list" class="orders-list"></div>
    </section>

    <!-- SELLER MASTER PANEL -->
    <section id="tab-seller" class="tab-panel">
      <h1>Seller Master Panel</h1>
      <div class="split">
        <div class="panel-box">
          <h2 id="seller-form-title">Add New Product</h2>
          <form id="seller-form">
            <input type="hidden" id="edit-id" />
            <label>Product Name</label>
            <input type="text" id="s-name" required />
            <label>Category</label>
            <input type="text" id="s-category" required />
            <label>Price (₹)</label>
            <input type="number" id="s-price" min="1" required />
            <label>Stock</label>
            <input type="number" id="s-stock" min="0" value="10" required />
            <label>Description</label>
            <textarea id="s-desc" rows="3" required></textarea>
            <div style="display:flex; gap:10px;">
              <button type="submit" class="btn-primary" id="seller-submit-btn">Save Product</button>
              <button type="button" class="btn-secondary" id="seller-cancel-btn" style="display:none;">Cancel Edit</button>
            </div>
          </form>
        </div>
        <div class="panel-box">
          <h2>Manage Inventory</h2>
          <div id="seller-list"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
